name: Release

# Publish to npm when a v* tag is pushed, using npm trusted publishing (OIDC).
# No NPM_TOKEN secret: configure the package's "Trusted Publisher" on npmjs.com
# to this repo + workflow. Provenance is emitted automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Node 24 bundles npm >= 11.5.1, which trusted publishing needs — no fragile
      # in-place `npm install -g npm@latest` (it can leave a broken sigstore dep).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run package
      # Idempotent: a re-run (or a hand-published first version) goes green.
      # Deliberately no `npm view` pre-check — the registry read endpoint lags
      # minutes behind a publish, so it reports "missing" for a version that
      # exists and turns the skip into a failed publish. Attempt the publish and
      # treat only the version-conflict error as success.
      - name: Publish
        run: |
          if out=$(npm publish 2>&1); then
            echo "$out"
          else
            status=$?
            echo "$out"
            printf '%s' "$out" | grep -qi 'cannot publish over the previously published versions' || exit "$status"
            echo 'Version already published — nothing to do.'
          fi
